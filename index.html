<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffcf2">
<title>Guess Secret Santa</title>
<style>
:root{--bg:#fffcf2;--text:#4a4e69;--border:#f0ebe3;--tomato:#ffadad;--banana:#fdffb6;--strawberry:#ffc6ff;--orange:#ffd6a5;--cherry:#ff8080;--default:#caffbf}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{min-height:100%;background:var(--bg)}
body{min-height:100vh;margin:0;padding:16px;padding-bottom:32px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);text-align:center;overflow-x:hidden}
h1{color:#d00000;font-size:1.8rem;margin:8px 0 16px}
.setup,.leaderboard{background:#fff;border-radius:20px;padding:15px;margin:0 auto 18px;box-shadow:0 4px 14px rgba(0,0,0,.06);max-width:600px}
.input-group{display:flex;gap:8px;margin-bottom:10px}
input,select,button{font:inherit}
input,select{font-size:16px;padding:12px;border:2px solid var(--border);border-radius:12px;outline:none;min-width:0}
input{flex:2}
select{flex:1;background:#fff}
.btn-row{display:flex;gap:8px}
button{padding:12px 15px;border:0;border-radius:12px;font-weight:700;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.98)}
.add-btn{background:#ffd6a5;color:#854d0e;flex:2}
.undo-btn{background:#bdb2ff;color:#fff;flex:1}
.reset-btn{background:#f1f3f5;color:#868e96;flex:1}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:600px;margin:0 auto 25px}
.player-box{min-height:115px;padding:14px 6px;border-radius:18px;cursor:pointer;user-select:none;-webkit-user-select:none;border:3px solid rgba(255,255,255,.55);box-shadow:0 4px 8px rgba(0,0,0,.05);display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:manipulation}
.fruit-icon{font-size:1.8rem;margin-bottom:4px}
.p-name{font-weight:700;font-size:.9rem;word-break:break-word;max-width:100%}
.p-score{font-size:1.5rem;font-weight:900;color:rgba(0,0,0,.4)}
.lb-title{font-size:1.1rem;margin-bottom:10px;font-weight:700;color:#d00000}
.lb-item{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed #eee}
.lb-item:last-child{border-bottom:0}
.empty{padding:18px;color:#999}
@media(min-width:520px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<h1>🎁 Secret Santa</h1>

<div class="setup">
  <div class="input-group">
    <input type="text" id="nameIn" placeholder="Name" autocomplete="off">
    <select id="fruitIn" aria-label="Icon">
      <option value="🍎">🍎</option><option value="🍍">🍍</option>
      <option value="🍉">🍉</option><option value="🥑">🥑</option>
    </select>
  </div>
  <div class="btn-row">
    <button class="add-btn" id="addBtn">+ Add</button>
    <button class="undo-btn" id="undoBtn">↩ Undo</button>
    <button class="reset-btn" id="resetBtn">Reset</button>
  </div>
</div>

<div class="grid" id="grid"></div>

<div class="leaderboard">
  <div class="lb-title">🏆 Leaderboard</div>
  <div id="lb-list"></div>
</div>

<script>
(function(){
  var fruitColors={
    "🍎":"#ffadad","🍍":"#fdffb6","🍉":"#ffd6a5","🥑":"#caffbf"
  };
  var defaultPlayers=[
    {name:"mera",score:0,icon:"🍅",color:"#ffadad"},
    {name:"adnana",score:0,icon:"🍌",color:"#fdffb6"},
    {name:"lala",score:0,icon:"🍓",color:"#ffc6ff"},
    {name:"roma",score:0,icon:"🍊",color:"#ffd6a5"},
    {name:"tusma",score:0,icon:"🍒",color:"#ff8080"}
  ];
  var players=[];
  var history=[];

  function clone(list){ return JSON.parse(JSON.stringify(list)); }

  function load(){
    try{
      var saved=localStorage.getItem("secret_santa_players");
      players=saved?JSON.parse(saved):clone(defaultPlayers);
    }catch(e){ players=clone(defaultPlayers); }
    render();
  }

  function saveHistory(){
    history.push(clone(players));
    if(history.length>20) history.shift();
  }

  function persist(){
    try{ localStorage.setItem("secret_santa_players",JSON.stringify(players)); }catch(e){}
  }

  function addPlayer(){
    var input=document.getElementById("nameIn");
    var name=input.value.trim();
    if(!name){ input.focus(); return; }
    saveHistory();
    var icon=document.getElementById("fruitIn").value;
    players.push({name:name,score:0,icon:icon,color:fruitColors[icon]||"#caffbf"});
    input.value="";
    persist(); render();
    input.focus();
  }

  function addPoint(index){
    if(!players[index]) return;
    saveHistory();
    players[index].score++;
    persist(); render();
  }

  function undo(){
    if(!history.length) return;
    players=history.pop();
    persist(); render();
  }

  function resetGame(){
    if(!players.length) return;
    if(window.confirm("Reset all scores?")){
      saveHistory();
      for(var i=0;i<players.length;i++) players[i].score=0;
      persist(); render();
    }
  }

  function safeText(value){
    return String(value).replace(/[&<>"']/g,function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }

  function render(){
    var grid=document.getElementById("grid");
    var lb=document.getElementById("lb-list");

    if(!players.length){
      grid.innerHTML='<div class="empty" style="grid-column:1/-1">No players yet — add some above!</div>';
      lb.innerHTML='<div class="empty">No scores yet.</div>';
      return;
    }

    var cards="";
    for(var i=0;i<players.length;i++){
      var p=players[i];
      cards+='<button class="player-box" data-index="'+i+'" style="background:'+safeText(p.color)+'">'
        +'<span class="fruit-icon">'+safeText(p.icon)+'</span>'
        +'<span class="p-name">'+safeText(p.name)+'</span>'
        +'<span class="p-score">'+Number(p.score)||0+'</span>'
        +'</button>';
    }
    grid.innerHTML=cards;

    var sorted=players.slice().sort(function(a,b){return b.score-a.score;});
    var rows="";
    for(var j=0;j<sorted.length;j++){
      rows+='<div class="lb-item"><span>'+safeText(sorted[j].icon)+" "+safeText(sorted[j].name)
        +'</span><b>'+Number(sorted[j].score||0)+' pts</b></div>';
    }
    lb.innerHTML=rows;

    var boxes=grid.querySelectorAll(".player-box");
    for(var k=0;k<boxes.length;k++){
      boxes[k].addEventListener("click",function(){
        addPoint(Number(this.getAttribute("data-index")));
      });
    }
  }

  document.getElementById("addBtn").addEventListener("click",addPlayer);
  document.getElementById("undoBtn").addEventListener("click",undo);
  document.getElementById("resetBtn").addEventListener("click",resetGame);
  document.getElementById("nameIn").addEventListener("keydown",function(e){
    if(e.key==="Enter") addPlayer();
  });

  load();
})();
</script>
</body>
</html>
